[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paperless-utilities"
version = "1.0.0"
description = "PDF sync and validation utilities for Paperless-ngx"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
authors = [
    {name = "paperless-utilities contributors"}
]
keywords = ["paperless", "pdf", "document-management", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "requests>=2.31.0",
    "pypdf>=6.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
paperless-sync = "paperless_sync:main"
paperless-mark-scanned = "mark_scanned:mark_tree_scanned_cli"
paperless-reconcile = "paperless_reconcile:main"

[tool.setuptools]
py-modules = ["paperless_sync", "mark_scanned", "paperless_reconcile", "paperless_file_utils"]
script-files = ["import_pdfs.sh", "pre-consume.sh"]

[project.urls]
Homepage = "https://github.com/cyberthreatgurl/paperless-utilities"
Repository = "https://github.com/cyberthreatgurl/paperless-utilities"
